[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py39"]
exclude = "(Tasks|notebooks|.dvc|.git)"

[tool.coverage.run]
source = ["app", "src"]
omit = ["src/register_model.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70

