name: CI

on:
  push:
  pull_request:

jobs:
  quality-test-build:
    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements/requirements-dev.txt
      - name: Format check
        run: black --check app src tests
      - name: Lint
        run: flake8 app src tests --max-line-length=88 --extend-ignore=E203,W503
      - name: Tests
        run: pytest --cov=app --cov=src --cov-report=term-missing
      - name: Build image
        run: docker build -t delivery-delay-api:${{ github.sha }} .
      - name: Login to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REGISTRY_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REGISTRY_USERNAME != ''
        run: |
          docker tag delivery-delay-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/delivery-delay-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/delivery-delay-api:${{ github.sha }}
